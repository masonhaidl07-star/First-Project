<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MOGCITY — Ascend or Stay NPC</title>
  <meta name="description" content="The 3D looksmaxxing life-sim. Put your face on your character, grind the gym, cop skincare at Mogulta, and climb the city rankings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>

  <!-- ===== Intro / character creation ===== -->
  <div id="intro" class="overlay">
    <div class="intro-card">
      <h1 class="logo">MOG<span>CITY</span></h1>
      <p class="tagline">The 3D looksmaxxing life-sim. Ascend or stay NPC.</p>

      <div id="intro-new">
        <label class="field">
          <span>Your name</span>
          <input id="name-input" type="text" maxlength="14" placeholder="e.g. Wyatt" autocomplete="off" />
        </label>

        <label class="field">
          <span>Your face (optional — stays on your device, never uploaded)</span>
          <input id="photo-input" type="file" accept="image/*" capture="user" />
        </label>
        <div class="face-row">
          <canvas id="face-preview" width="96" height="96"></canvas>
          <div class="tones" id="tones"></div>
        </div>

        <button id="start-btn" class="big-btn">ENTER MOGCITY</button>
      </div>

      <div id="intro-continue" class="hidden">
        <p id="continue-label" class="continue-label"></p>
        <button id="continue-btn" class="big-btn">CONTINUE</button>
        <button id="newgame-btn" class="ghost-btn">Start over (wipes save)</button>
      </div>

      <p class="fine">Tips inside are real. The vibes are satire. <a href="playbook.html">📖 Read the Playbook</a></p>
    </div>
  </div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div id="player-card">
      <div id="hud-name">—</div>
      <div id="hud-title">NPC</div>
      <div id="hud-aura">AURA 0</div>
      <div class="bars">
        <div class="bar"><span>SKIN</span><div class="track"><div id="bar-skin" class="fill"></div></div></div>
        <div class="bar"><span>HAIR</span><div class="track"><div id="bar-hair" class="fill"></div></div></div>
        <div class="bar"><span>FIT</span><div class="track"><div id="bar-fitness" class="fill"></div></div></div>
        <div class="bar"><span>DRIP</span><div class="track"><div id="bar-drip" class="fill"></div></div></div>
      </div>
    </div>
    <div id="cash">$0 MB</div>
    <button id="lb-btn">🏆 Rankings</button>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="joy"><div id="joy-knob"></div></div>
    <button id="act-btn">ACT</button>
    <div id="keys-help">WASD / arrows to move · E to interact</div>
  </div>

  <!-- ===== Store / quiz / leaderboard modal ===== -->
  <div id="modal-wrap" class="overlay hidden">
    <div id="modal">
      <button id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
