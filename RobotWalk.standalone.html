<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Walk</title>
<!-- Plain React via CDN. No build step, no JSX, no Babel: everything below
     uses React.createElement (aliased to `h`). -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  :root { --accent: #46d6ff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0b1026;
    color: #e8edff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #root { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .app { width: min(880px, 96vw); }
  .titlebar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .titlebar h1 { margin: 0; font-size: clamp(18px, 3.5vw, 30px); letter-spacing: 2px; }
  .titlebar h1 span { color: var(--accent); }
  .titlebar small { opacity: .5; letter-spacing: 1px; }
  .frame {
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.07);
    display: block; width: 100%;
  }
  .transport {
    margin-top: 14px; display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.06); padding: 12px 16px; border-radius: 12px;
    backdrop-filter: blur(6px); flex-wrap: wrap;
  }
  .transport button {
    background: var(--accent); color: #06223a; border: none;
    width: 44px; height: 38px; border-radius: 9px; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .transport button:hover { filter: brightness(1.08); }
  .scrub { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
  .scrub input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .time { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .8; min-width: 92px; text-align: right; }
  .chip {
    font-size: 11px; letter-spacing: 1px; opacity: .7; cursor: pointer;
    background: transparent; border: 1px solid rgba(255,255,255,.2); color: inherit;
    padding: 6px 10px; border-radius: 999px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  const { useState, useRef, useEffect, createElement: h } = React;

  // ───────────────────────────── Timeline engine ─────────────────────────────
  // Easing functions, t in [0,1].
  const Ease = {
    linear: t => t,
    in:     t => t * t * t,
    out:    t => 1 - Math.pow(1 - t, 3),
    inOut:  t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    back:   t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    bounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
      return n * (t -= 2.625 / d) * t + 0.984375;
    },
  };

  // Map x from input range to output range with easing. Clamps outside the range.
  function interpolate(x, inRange, outRange, ease = Ease.linear) {
    const [x0, x1] = inRange, [y0, y1] = outRange;
    if (x <= x0) return y0;
    if (x >= x1) return y1;
    return y0 + (y1 - y0) * ease((x - x0) / (x1 - x0));
  }

  // Evaluate a keyframe track at time t. keys: [{ t, v, ease? }] sorted by t.
  // ease on a key describes the segment ENTERING that key.
  function animate(t, keys) {
    if (t <= keys[0].t) return keys[0].v;
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (t >= a.t && t <= b.t) return interpolate(t, [a.t, b.t], [a.v, b.v], b.ease || Ease.linear);
    }
    return keys[keys.length - 1].v;
  }

  const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;

  // <Stage> drives a looping clock and renders children(time). It also owns the
  // transport UI: play/pause, a scrubber, a time readout, and quick-seek chips.
  function Stage({ duration, markers = [], children }) {
    const [time, setTime] = useState(0);
    const [playing, setPlaying] = useState(true);
    const raf = useRef(0), last = useRef(null), timeRef = useRef(0);
    timeRef.current = time;

    useEffect(() => {
      function loop(now) {
        if (last.current == null) last.current = now;
        const dt = (now - last.current) / 1000; last.current = now;
        if (playing) setTime(t => (t + dt) % duration);
        raf.current = requestAnimationFrame(loop);
      }
      raf.current = requestAnimationFrame(loop);
      return () => { cancelAnimationFrame(raf.current); last.current = null; };
    }, [playing, duration]);

    const seek = v => { setPlaying(false); setTime(Math.max(0, Math.min(duration, v))); };

    return h("div", null,
      children(time),
      h("div", { className: "transport" },
        h("button", { onClick: () => setPlaying(p => !p), title: "Play / Pause" }, playing ? "❚❚" : "►"),
        h("div", { className: "scrub" },
          h("input", {
            type: "range", min: 0, max: duration, step: 0.01, value: time,
            onChange: e => seek(parseFloat(e.target.value)),
          }),
        ),
        h("div", { className: "time" }, `${fmt(time)} / ${fmt(duration)}`),
        markers.map(m =>
          h("button", { key: m.t, className: "chip", onClick: () => seek(m.t) }, m.label)),
      ),
    );
  }

  // ───────────────────────────── Scene primitives ─────────────────────────────
  const C = { metal: "#cdd6f4", metalDark: "#8b93b8", accent: "#46d6ff", dark: "#101830" };

  // A two-segment limb (thigh + shin) built from nested rotations so the knee
  // follows the thigh. Angles in degrees; 0 points straight down.
  function Limb({ x, y, upper, lower, thigh, knee, width, color, foot }) {
    return h("g", { transform: `translate(${x},${y}) rotate(${thigh})` },
      h("line", { x1: 0, y1: 0, x2: 0, y2: upper, stroke: color, strokeWidth: width, strokeLinecap: "round" }),
      h("g", { transform: `translate(0,${upper}) rotate(${knee})` },
        h("line", { x1: 0, y1: 0, x2: 0, y2: lower, stroke: color, strokeWidth: width, strokeLinecap: "round" }),
        foot && h("ellipse", { cx: 4, cy: lower, rx: 11, ry: 4.5, fill: C.accent }),
      ),
    );
  }

  // The robot. `pose` carries every animatable value; RobotWalkScene computes it.
  function Robot({ pose }) {
    const p = pose;
    const dizzy = p.bodyPitch > 45; // X_X eyes once we're past the point of no return
    const eye = (cx) => dizzy
      ? h("g", { stroke: C.accent, strokeWidth: 2.4, strokeLinecap: "round" },
          h("line", { x1: cx - 4, y1: -38, x2: cx + 4, y2: -30 }),
          h("line", { x1: cx + 4, y1: -38, x2: cx - 4, y2: -30 }))
      : h("ellipse", { cx, cy: -34, rx: 4, ry: 5 * p.blink, fill: C.accent });

    return h("g", { transform: `translate(${p.x},${p.y})` },
      // ground shadow (stays on the floor, shrinks as the robot lifts/falls)
      h("ellipse", { cx: 0, cy: 70, rx: Math.max(10, 40 - p.drop * 0.25), ry: 7,
        fill: "rgba(0,0,0,.35)" }),

      // everything that can tip over rotates around the hip
      h("g", { transform: `translate(0,${p.drop}) rotate(${p.bodyPitch})` },
        // legs (drawn from the hip downward)
        Limb({ x: -9, y: 0, upper: 34, lower: 34, thigh: p.legBack, knee: p.kneeBack, width: 11, color: C.metalDark, foot: true }),
        Limb({ x: 9, y: 0, upper: 34, lower: 34, thigh: p.legFront, knee: p.kneeFront, width: 11, color: C.metal, foot: true }),

        // arms (behind first, then in front)
        Limb({ x: -22, y: -38, upper: 20, lower: 18, thigh: p.armBack, knee: p.armBack * 0.4, width: 9, color: C.metalDark }),

        // torso
        h("rect", { x: -28, y: -52, width: 56, height: 56, rx: 12, fill: C.metal }),
        h("rect", { x: -28, y: -20, width: 56, height: 24, rx: 10, fill: C.metalDark }),
        h("circle", { cx: 0, cy: -28, r: 9, fill: C.accent }),
        h("circle", { cx: -3, cy: -31, r: 3, fill: "rgba(255,255,255,.85)" }),

        // head
        h("rect", { x: -6, y: -64, width: 12, height: 14, fill: C.metalDark }),
        h("g", { transform: `rotate(${p.headPitch})` },
          h("rect", { x: -25, y: -98, width: 50, height: 42, rx: 12, fill: C.metal }),
          h("rect", { x: -18, y: -92, width: 36, height: 20, rx: 8, fill: C.dark }),
          eye(-8), eye(8),
          h("line", { x1: 0, y1: -98, x2: 0, y2: -112, stroke: C.metalDark, strokeWidth: 3 }),
          h("circle", { cx: 0, cy: -115, r: 4, fill: C.accent }),
        ),

        // front arm last so it reads on top of the torso
        Limb({ x: 22, y: -38, upper: 20, lower: 18, thigh: p.armFront, knee: p.armFront * 0.4, width: 9, color: C.metal }),
      ),
    );
  }

  // A single building with lit windows.
  function Building({ x, w, hgt, baseY, color }) {
    const win = [];
    for (let wy = baseY - hgt + 14; wy < baseY - 12; wy += 22)
      for (let wx = x + 8; wx < x + w - 10; wx += 18)
        win.push(h("rect", { key: wx + "_" + wy, x: wx, y: wy, width: 8, height: 11, rx: 1,
          fill: (wx * 7 + wy * 13) % 5 === 0 ? "rgba(70,214,255,.55)" : "rgba(255,255,255,.10)" }));
    return h("g", null,
      h("rect", { x, y: baseY - hgt, width: w, height: hgt, fill: color }),
      win);
  }

  // A parallax layer of buildings that scrolls with the world and wraps around.
  function BuildingLayer({ scroll, baseY, color, seed, count }) {
    const span = 900;
    const off = ((scroll % span) + span) % span;
    const items = [];
    for (let k = -1; k < count + 1; k++) {
      const i = ((k % count) + count) % count;
      const r = (n) => (Math.sin((seed + i) * n) * 0.5 + 0.5);
      const w = 70 + r(12.9) * 70;
      const hgt = 70 + r(78.2) * 150;
      const x = -off + k * (span / count) + r(3.3) * 20;
      items.push(h("g", { key: k }, Building({ x, w, hgt, baseY, color })));
    }
    return h("g", null, items);
  }

  // ───────────────────────────── The walk + the gag ─────────────────────────────
  const DURATION = 12;     // loop length (s)
  const TRIP = 7.7;        // the famous stumble
  const GROUND_Y = 300;
  const ROBOT_X = 360;
  const V = 70;            // world units / second while walking

  // World scroll as a closed-form function of time so scrubbing stays exact.
  // Walk → freeze at the trip → resume after recovery (as if 3s never happened).
  function worldXAt(t) {
    if (t < 7.55) return V * t;
    if (t < 10.55) return V * 7.55;
    return V * (t - 3.0);
  }

  // Compute the full robot pose for a given time.
  function poseAt(t) {
    const phase = worldXAt(t) * 0.075;       // leg phase tracks the ground
    const swing = Math.sin(phase);
    const lift = Math.max(0, -Math.cos(phase));

    // Default: a relaxed walk cycle.
    const pose = {
      x: ROBOT_X, y: GROUND_Y - 70, drop: 0,
      legFront:  swing * 24,
      legBack:  -swing * 24,
      kneeFront: lift * 26,
      kneeBack:  (1 - lift) * 26,
      armFront: -swing * 20,
      armBack:   swing * 20,
      bodyPitch: 3 * Math.sin(phase * 2) + 4,   // gentle forward lean
      headPitch: 2 * Math.sin(phase * 2),
      blink: Math.sin(t * 3.1) > 0.96 ? 0.15 : 1,
      drop: -Math.abs(Math.sin(phase)) * 4,     // body bob
    };

    // The trip: foot catches at TRIP, body pitches over, faceplant, recover.
    if (t >= 7.5 && t <= 10.7) {
      pose.bodyPitch = animate(t, [
        { t: 7.5,  v: pose.bodyPitch },
        { t: 7.7,  v: 8,   ease: Ease.out },     // toe catches, torso jolts
        { t: 8.05, v: 42,  ease: Ease.in },      // tipping past recovery
        { t: 8.45, v: 86,  ease: Ease.in },      // face toward the floor
        { t: 8.7,  v: 90,  ease: Ease.bounce },  // flat, with a little oof
        { t: 9.6,  v: 90 },                       // lying there, regretting it
        { t: 10.2, v: 38,  ease: Ease.out },     // pushing back up
        { t: 10.7, v: 4,   ease: Ease.back },    // upright, slight overshoot
      ]);
      pose.drop = animate(t, [
        { t: 7.5,  v: pose.drop },
        { t: 7.7,  v: -2 },
        { t: 8.45, v: 28,  ease: Ease.in },
        { t: 8.7,  v: 40,  ease: Ease.bounce },  // chest near the ground
        { t: 9.6,  v: 40 },
        { t: 10.2, v: 12,  ease: Ease.out },
        { t: 10.7, v: 0,   ease: Ease.out },
      ]);
      // arms flail up, then sprawl, then push off the ground
      pose.armFront = animate(t, [
        { t: 7.6, v: pose.armFront },
        { t: 7.85, v: -150, ease: Ease.out },
        { t: 8.5,  v: -40,  ease: Ease.in },
        { t: 9.6,  v: -30 },
        { t: 10.2, v: 20,   ease: Ease.out },
        { t: 10.7, v: 0 },
      ]);
      pose.armBack = animate(t, [
        { t: 7.6, v: pose.armBack },
        { t: 7.85, v: 150, ease: Ease.out },
        { t: 8.5,  v: 40,  ease: Ease.in },
        { t: 9.6,  v: 30 },
        { t: 10.2, v: -20, ease: Ease.out },
        { t: 10.7, v: 0 },
      ]);
      // the offending front leg snags, the back leg swings up behind
      pose.legFront = animate(t, [
        { t: 7.55, v: pose.legFront }, { t: 7.7, v: -18, ease: Ease.out },
        { t: 8.5, v: -25 }, { t: 10.2, v: -10, ease: Ease.out }, { t: 10.7, v: pose.legFront },
      ]);
      pose.legBack = animate(t, [
        { t: 7.55, v: pose.legBack }, { t: 7.9, v: 30, ease: Ease.out },
        { t: 8.5, v: 22 }, { t: 10.2, v: 10, ease: Ease.out }, { t: 10.7, v: pose.legBack },
      ]);
      pose.kneeFront = 10; pose.kneeBack = 18;
      pose.headPitch = animate(t, [
        { t: 7.6, v: 0 }, { t: 8.5, v: 12 }, { t: 9.6, v: 12 }, { t: 10.7, v: 0 },
      ]);
    }
    return pose;
  }

  function RobotWalkScene(time) {
    const t = time % DURATION;
    const scroll = worldXAt(t);
    const tripping = t > 7.7 && t < 8.7;

    return h("svg", { className: "frame", viewBox: "0 0 720 360",
        preserveAspectRatio: "xMidYMid meet" },
      h("defs", null,
        h("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 },
          h("stop", { offset: "0%", stopColor: "#0b1026" }),
          h("stop", { offset: "70%", stopColor: "#1b2350" }),
          h("stop", { offset: "100%", stopColor: "#27305f" })),
      ),
      h("rect", { x: 0, y: 0, width: 720, height: 360, fill: "url(#sky)" }),

      // stars
      h("g", { fill: "#bfe9ff" },
        Array.from({ length: 50 }, (_, i) => h("circle", {
          key: i, cx: (i * 137.5) % 720, cy: (i * 53) % 200,
          r: (i % 3) * 0.5 + 0.4, opacity: 0.25 + (i % 5) * 0.12 }))),

      // parallax cityscape, far → near
      BuildingLayer({ scroll: scroll * 0.18, baseY: 300, color: "rgba(70,214,255,.10)", seed: 1, count: 6 }),
      BuildingLayer({ scroll: scroll * 0.4,  baseY: 305, color: "rgba(40,60,120,.55)",  seed: 2, count: 7 }),

      // ground
      h("rect", { x: 0, y: GROUND_Y, width: 720, height: 60, fill: "rgba(255,255,255,.04)" }),
      h("line", { x1: 0, y1: GROUND_Y, x2: 720, y2: GROUND_Y, stroke: "rgba(70,214,255,.35)", strokeWidth: 2 }),
      h("g", { stroke: "rgba(70,214,255,.18)", strokeWidth: 3 },
        Array.from({ length: 14 }, (_, i) => {
          const x = ((i * 60 - (scroll % 60)) % 780 + 780) % 780 - 30;
          return h("line", { key: i, x1: x, y1: GROUND_Y + 20, x2: x + 26, y2: GROUND_Y + 20 });
        })),

      // a little stray bolt on the ground — the thing it trips over
      (function () {
        const bx = ROBOT_X + (worldXAt(TRIP) - scroll) + 22;
        return h("g", { transform: `translate(${bx}, ${GROUND_Y - 4})` },
          h("rect", { x: -5, y: -3, width: 10, height: 6, rx: 1, fill: C.metalDark }),
          h("rect", { x: -2, y: -8, width: 4, height: 6, fill: C.metal }));
      })(),

      h(Robot, { pose: poseAt(t) }),

      // gag caption
      tripping && h("text", {
        x: ROBOT_X + 70, y: GROUND_Y - 120, fill: C.accent, fontSize: 26,
        fontFamily: "monospace", fontWeight: "bold",
        opacity: interpolate(t, [7.7, 7.9], [0, 1]) * interpolate(t, [8.4, 8.7], [1, 0]),
        transform: `rotate(-8 ${ROBOT_X + 70} ${GROUND_Y - 120})`,
      }, "whoa—!"),
    );
  }

  // ───────────────────────────── Mount ─────────────────────────────
  function App() {
    return h("div", { className: "app" },
      h("div", { className: "titlebar" },
        h("h1", null, "ROBOT", h("span", null, "WALK")),
        h("small", null, "plain React.createElement · timeline + keyframes")),
      h(Stage, {
        duration: DURATION,
        markers: [
          { t: 0, label: "start" },
          { t: TRIP, label: "trip @7.7s" },
          { t: 10.7, label: "recovered" },
        ],
      }, time => RobotWalkScene(time)),
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
